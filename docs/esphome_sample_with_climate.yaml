esphome:
  name: esp32-comfoair-can-bridge
  friendly_name: ComfoAir Q450 CAN
  name_add_mac_suffix: false

esp32:
  board: esp32-evb
  framework:
    type: arduino

logger:

external_components:
  - source:
      type: git
      url: https://github.com/tarbax/comfoair-esp32
      ref: master
    components: [comfoair]

api:
  encryption:
    key: !secret api_key
  custom_services: true

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ComfoAir component with Climate entity
comfoair:
  - id: comfo
    name: "ComfoAir Q450"
    
    # CAN-Bus Pins
    tx_pin: 05
    rx_pin: 35

    # Native fan entity: off = away (level 0), speed 1-3, preset "Auto"
    fan:
      name: "Ventilation"

    # Boost select: "Off" + one option per duration
    boost:
      name: "Boost"
      durations: [10min, 20min, 30min, 1h, 2h, 3h, 4h]

    # Bypass select: Auto / Open <duration> / Open (permanent) / Closed <duration> / Closed (permanent)
    bypass:
      name: "Bypass"
      durations: [1h, 2h, 4h, 8h, 12h, 24h]
    
    # Sensor configurations
    fan_speed:
      name: "Fan Speed"
    
    exhaust_air_temp:
      name: "Exhaust Air Temperature"
    
    extract_air_temp:
      name: "Extract Air Temperature"
    
    outdoor_air_temp:
      name: "Outdoor Air Temperature"
    
    supply_air_humidity:
      name: "Supply Air Humidity"
    
    exhaust_air_humidity:
      name: "Exhaust Air Humidity"
    
    target_temp:
      name: "Target Temperature"
    
    bypass_state:
      name: "Bypass Status"
    
    power_consumption_current:
      name: "Current Power Consumption"
    
    days_remaining_filter:
      name: "Days Until Filter Change"
    
    # Text Sensors
    operating_mode:
      name: "Operating Mode"
    
    temp_profile:
      name: "Temperature Profile"
    
    # Binary Sensors
    heating_season:
      name: "Heating Season"
    
    cooling_season:
      name: "Cooling Season"
    
    manual_mode:
      name: "Manual Mode"

# Time synchronization
time:
  - platform: homeassistant
    id: homeassistant_time

# Web server for local access
web_server:
  port: 80

# Select menus for manual control
# (ventilation level, boost and bypass are native entities now, see above)
select:
  - platform: template
    name: "Operating Mode"
    id: comfoair_mode
    optimistic: true
    options:
      - "Auto"
      - "Manual"
    initial_option: "Auto"
    set_action:
      - lambda: |-
          if (x == "Auto") {
            id(comfo).send_command("auto");
          } else if (x == "Manual") {
            id(comfo).send_command("manual");
          }
  
  - platform: template
    name: "Temperature Profile"
    id: comfoair_temp_profile
    optimistic: true
    options:
      - "Normal"
      - "Cool"
      - "Warm"
    initial_option: "Normal"
    set_action:
      - lambda: |-
          if (x == "Normal") {
            id(comfo).send_command("temp_profile_normal");
          } else if (x == "Cool") {
            id(comfo).send_command("temp_profile_cool");
          } else if (x == "Warm") {
            id(comfo).send_command("temp_profile_warm");
          }
