esphome:
  name: esp32-comfoair-can-bridge
  friendly_name: ComfoAir Q450 CAN
  name_add_mac_suffix: false

esp32:
  board: esp32-evb
  framework:
    type: arduino

logger:

external_components:
  - source:
      type: git
      url: https://github.com/waverider93/comfoair-esp32
      ref: fix/memory-leak-and-optimizations
    components: [comfoair]

api:
  encryption:
    key: "redacted"
  custom_services: true

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ComfoAir component with Climate entity
comfoair:
  - id: comfo
    name: "ComfoAir Q450"
    
    # CAN-Bus Pins
    tx_pin: 05
    rx_pin: 35
    
    # Sensor configurations
    fan_speed:
      name: "Fan Speed"
    
    exhaust_air_temp:
      name: "Exhaust Air Temperature"
    
    extract_air_temp:
      name: "Extract Air Temperature"
    
    outdoor_air_temp:
      name: "Outdoor Air Temperature"
    
    supply_air_humidity:
      name: "Supply Air Humidity"
    
    exhaust_air_humidity:
      name: "Exhaust Air Humidity"
    
    target_temp:
      name: "Target Temperature"
    
    bypass_state:
      name: "Bypass Status"
    
    power_consumption_current:
      name: "Current Power Consumption"
    
    days_remaining_filter:
      name: "Days Until Filter Change"
    
    # Text Sensors
    operating_mode:
      name: "Operating Mode"
    
    temp_profile:
      name: "Temperature Profile"
    
    # Binary Sensors
    heating_season:
      name: "Heating Season"
    
    cooling_season:
      name: "Cooling Season"
    
    manual_mode:
      name: "Manual Mode"

# Time synchronization
time:
  - platform: homeassistant
    id: homeassistant_time

# Web server for local access
web_server:
  port: 80

# Manual control via buttons
button:
  - platform: template
    name: "Boost 10 Minutes"
    id: comfoair_boost_10min
    on_press:
      then:
        - lambda: |-
            id(comfo).send_command("boost_10_min");
  
  - platform: template
    name: "Boost 20 Minutes"
    on_press:
      then:
        - lambda: |-
            id(comfo).send_command("boost_20_min");
  
  - platform: template
    name: "Boost 30 Minutes"
    on_press:
      then:
        - lambda: |-
            id(comfo).send_command("boost_30_min");

  - platform: template
    name: "Boost 60 Minutes"
    on_press:
      then:
        - lambda: |-
            id(comfo).send_command("boost_60_min");
  
  - platform: template
    name: "End Boost"
    on_press:
      then:
        - lambda: |-
            id(comfo).send_command("boost_end");

# Select-Menu voor handmatige besturing met nieuwe namen
select:
  - platform: template
    name: "Ventilation Level"
    id: comfoair_ventilation_level
    optimistic: true
    options:
      - "Away"
      - "Low"
      - "Medium"
      - "High"
    initial_option: "Low"
    set_action:
      - lambda: |-
          if (x == "Low") {
            id(comfo).send_command("ventilation_level_1");
          } else if (x == "Medium") {
            id(comfo).send_command("ventilation_level_2");
          } else if (x == "High") {
            id(comfo).send_command("ventilation_level_3");
          } else if (x == "Away") {
            id(comfo).send_command("ventilation_level_0");
          }
  
  - platform: template
    name: "Operating Mode"
    id: comfoair_mode
    optimistic: true
    options:
      - "Auto"
      - "Manual"
    initial_option: "Auto"
    set_action:
      - lambda: |-
          if (x == "Auto") {
            id(comfo).send_command("auto");
          } else if (x == "Manual") {
            id(comfo).send_command("manual");
          }
  
  - platform: template
    name: "Temperature Profile"
    id: comfoair_temp_profile
    optimistic: true
    options:
      - "Normal"
      - "Cool"
      - "Warm"
    initial_option: "Normal"
    set_action:
      - lambda: |-
          if (x == "Normal") {
            id(comfo).send_command("temp_profile_normal");
          } else if (x == "Cool") {
            id(comfo).send_command("temp_profile_cool");
          } else if (x == "Warm") {
            id(comfo).send_command("temp_profile_warm");
          }
  
  - platform: template
    name: "Bypass Mode"
    id: comfoair_bypass
    optimistic: true
    options:
      - "Auto"
      - "1h Activated"
      - "1h Deactivated"
    initial_option: "Auto"
    set_action:
      - lambda: |-
          if (x == "Auto") {
            id(comfo).send_command("bypass_auto");
          } else if (x == "1h Activated") {
            id(comfo).send_command("bypass_activate_1h");
          } else if (x == "1h Deactivated") {
            id(comfo).send_command("bypass_deactivate_1h");
          }

