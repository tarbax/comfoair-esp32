esphome:
  name: comfoair
  friendly_name: ComfoAir

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/tarbax/comfoair-esp32
      ref: master
    components: [comfoair]

logger:

api:
  encryption:
    key: !secret api_key
  custom_services: true  # Required for the comfoair services (ESPHome 2026.3+)

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

comfoair:
  - id: comfo
    name: "ComfoAir Q350"   # climate entity
    rx_pin: 21
    tx_pin: 25

    # Native fan entity: off = away (level 0), speed 1-3, preset "Auto".
    # Created by default as "Ventilation"; rename or hide it like any fan.
    fan:
      name: "Ventilation"

    # Boost select: "Off" + one option per duration.
    boost:
      name: "Boost"
      durations: [10min, 20min, 30min, 45min, 1h, 2h, 3h, 4h, 6h, 8h]

    # Bypass select: "Auto", "Open <duration>", "Open (permanent)",
    # "Closed <duration>", "Closed (permanent)".
    bypass:
      name: "Bypass"
      durations: [1h, 2h, 4h, 8h, 12h, 24h]

    # Every sensor is created with a sensible name, unit, device class and icon.
    # Override anything per sensor, e.g.:
    # supply_fan_speed:
    #   name: "Supply fan RPM"
    #   internal: true            # don't expose to Home Assistant

    # Throttle all sensors at once:
    # global_filters:
    #   - throttle: 10s

web_server:
  port: 80
